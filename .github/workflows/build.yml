name: Build

on:
  push:
    branches:
      - main

jobs:
  build-and-version:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate version
        shell: bash
        run: |
          TAG=$(git tag --list "v*" | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi

          VERSION=${TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"

          if ! [[ "$major" =~ ^[0-9]+$ ]] || ! [[ "$minor" =~ ^[0-9]+$ ]] || ! [[ "$patch" =~ ^[0-9]+$ ]]; then
            major=1
            minor=0
            patch=0
          else
            patch=$((patch + 1))
          fi

          NEW_VERSION="v$major.$minor.$patch"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "New version: $NEW_VERSION"

      - name: Create and push tag
        shell: bash
        run: |
          NEW_VERSION="${{ env.NEW_VERSION }}"
          if git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; then
            echo "Tag ${NEW_VERSION} already exists. Skipping tag creation."
            exit 0
          fi

          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          git push origin "${NEW_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.NEW_VERSION }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_DESCRIPTION=Fizzy is Kanban as it should be.
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
